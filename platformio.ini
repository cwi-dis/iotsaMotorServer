; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs =
    nodemcuv2
    vanilla_esp32
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of iotsa-board-defs.ini. Refresh both files whenever the iotsa dependency
; is bumped; do not hand-edit. App-specific choices stay in the [env:*] sections.
extra_configs =
    iotsa-board-traits.ini
    iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps =
	https://github.com/cwi-dis/iotsa.git#develop
	AccelStepper
build_flags = -DIOTSA_WITH_HTTPS

; The deployed motor servers are ESP8266 (iotsa board / ESP-12 / ESP-201). 4m1m
; (1MB LittleFS -- unused here, all config is compile-time) leaves room for the
; OTA scratch partition; 4m3m had none. HTTP only: BearSSL on ESP8266 is too
; slow/unstable in practice -- see cwi-dis/iotsa#159.
[env:nodemcuv2]
extends = iotsa_v4
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
monitor_speed = 115200

; Build-only canary: no ESP32 motor server is deployed, but keep an ESP32 target
; compiling against develop so future units can be based on one. vanilla_esp32
; tracks iotsa's current default plain-ESP32 board.
[env:vanilla_esp32]
extends = vanilla_esp32
board_build.partitions = min_spiffs.csv
